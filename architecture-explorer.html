<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enterprise Architecture Explorer — Stonebranch Batch Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #0a0a0f;
  --bg-secondary: #12121a;
  --bg-tertiary: #1a1a28;
  --bg-card: #1e1e30;
  --bg-glass: rgba(30,30,48,0.75);
  --bg-glass-hover: rgba(40,40,64,0.85);
  --border: rgba(255,255,255,0.06);
  --border-hover: rgba(255,255,255,0.12);
  --text-primary: #e8e8f0;
  --text-secondary: #9090a8;
  --text-tertiary: #606078;
  --accent-blue: #4a8cff;
  --accent-green: #34d399;
  --accent-purple: #a78bfa;
  --accent-orange: #fb923c;
  --accent-red: #f87171;
  --accent-yellow: #fbbf24;
  --accent-cyan: #22d3ee;
  --shadow: 0 8px 32px rgba(0,0,0,0.5);
  --shadow-lg: 0 16px 48px rgba(0,0,0,0.6);
  --radius: 12px;
  --radius-sm: 8px;
  --radius-xs: 4px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:var(--bg-primary); color:var(--text-primary); font-family:var(--font); font-size:14px; -webkit-font-smoothing:antialiased; }
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.1); border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:rgba(255,255,255,0.2); }

/* === TOP BAR === */
.topbar {
  position:fixed; top:0; left:0; right:0; height:56px; z-index:100;
  background:var(--bg-glass); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 20px; gap:16px;
}
.topbar-logo { display:flex; align-items:center; gap:10px; font-weight:700; font-size:15px; color:var(--text-primary); letter-spacing:-0.3px; }
.topbar-logo svg { width:24px; height:24px; }
.topbar-logo span { color:var(--text-secondary); font-weight:400; }
.search-container { position:relative; flex:1; max-width:480px; }
.search-container input {
  width:100%; height:36px; background:var(--bg-secondary); border:1px solid var(--border);
  border-radius:var(--radius-sm); padding:0 36px 0 14px; color:var(--text-primary);
  font-size:13px; font-family:var(--font); outline:none; transition:var(--transition);
}
.search-container input:focus { border-color:var(--accent-blue); background:var(--bg-tertiary); }
.search-container input::placeholder { color:var(--text-tertiary); }
.search-icon { position:absolute; right:10px; top:50%; transform:translateY(-50%); color:var(--text-tertiary); pointer-events:none; }
.topbar-actions { display:flex; gap:8px; }
.topbar-btn {
  height:34px; padding:0 14px; border-radius:var(--radius-sm); border:1px solid var(--border);
  background:transparent; color:var(--text-secondary); font-size:12px; font-family:var(--font);
  cursor:pointer; transition:var(--transition); display:flex; align-items:center; gap:6px; white-space:nowrap;
}
.topbar-btn:hover { background:var(--bg-tertiary); color:var(--text-primary); border-color:var(--border-hover); }
.topbar-btn.active { background:var(--accent-blue); color:#fff; border-color:var(--accent-blue); }
.topbar-btn svg { width:14px; height:14px; }

/* === STATUS BAR === */
.statusbar {
  position:fixed; bottom:0; left:0; right:0; height:32px; z-index:100;
  background:var(--bg-glass); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--border); display:flex; align-items:center; padding:0 16px; gap:20px;
  font-size:11px; color:var(--text-tertiary);
}
.statusbar-item { display:flex; align-items:center; gap:6px; }
.statusbar-dot { width:6px; height:6px; border-radius:50%; background:var(--accent-green); }
.statusbar-right { margin-left:auto; display:flex; gap:16px; }

/* === CANVAS === */
.canvas-container {
  position:fixed; top:56px; left:0; right:0; bottom:32px; overflow:hidden; cursor:grab;
  background: var(--bg-primary);
  background-image:
    radial-gradient(circle at 1px 1px, rgba(255,255,255,0.03) 1px, transparent 0);
  background-size: 24px 24px;
}
.canvas-container.grabbing { cursor:grabbing; }
.canvas {
  position:absolute; top:0; left:0; transform-origin:0 0;
  transition: transform 0.05s linear;
}
.canvas.no-transition { transition: none !important; }

/* === NODE === */
.node {
  position:absolute; padding:12px 16px; border-radius:var(--radius);
  background:var(--bg-glass); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border:1px solid var(--border); cursor:pointer; transition:var(--transition);
  min-width:140px; max-width:220px; user-select:none;
}
.node:hover { border-color:var(--border-hover); background:var(--bg-glass-hover); transform:translateY(-1px); box-shadow:var(--shadow); }
.node.selected { border-color:var(--accent-blue); box-shadow:0 0 0 1px var(--accent-blue), var(--shadow); }
.node.highlighted { border-color:var(--accent-yellow); box-shadow:0 0 0 1px var(--accent-yellow), var(--shadow); }
.node.dimmed { opacity:0.25; }
.node-header { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
.node-icon { width:20px; height:20px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0; }
.node-name { font-size:13px; font-weight:600; color:var(--text-primary); line-height:1.3; letter-spacing:-0.2px; }
.node-type { font-size:10px; color:var(--text-tertiary); text-transform:uppercase; letter-spacing:0.5px; font-weight:500; }
.node-file { font-size:10px; color:var(--text-tertiary); margin-top:3px; font-family:'SF Mono', 'Fira Code', monospace; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* Node type colors */
.node-type-user .node-icon { background:rgba(52,211,153,0.2); color:var(--accent-green); }
.node-type-user { border-color:rgba(52,211,153,0.2); }
.node-type-frontend .node-icon { background:rgba(74,140,255,0.2); color:var(--accent-blue); }
.node-type-frontend { border-color:rgba(74,140,255,0.15); }
.node-type-backend .node-icon { background:rgba(34,211,238,0.2); color:var(--accent-cyan); }
.node-type-backend { border-color:rgba(34,211,238,0.15); }
.node-type-service .node-icon { background:rgba(167,139,250,0.2); color:var(--accent-purple); }
.node-type-service { border-color:rgba(167,139,250,0.15); }
.node-type-middleware .node-icon { background:rgba(251,191,36,0.2); color:var(--accent-yellow); }
.node-type-middleware { border-color:rgba(251,191,36,0.15); }
.node-type-uac .node-icon { background:rgba(167,139,250,0.2); color:var(--accent-purple); }
.node-type-uac { border-color:rgba(167,139,250,0.2); }
.node-type-external .node-icon { background:rgba(248,113,113,0.2); color:var(--accent-red); }
.node-type-external { border-color:rgba(248,113,113,0.15); }
.node-type-infra .node-icon { background:rgba(251,146,60,0.2); color:var(--accent-orange); }
.node-type-infra { border-color:rgba(251,146,60,0.15); }
.node-type-store .node-icon { background:rgba(74,140,255,0.2); color:var(--accent-blue); }
.node-type-store { border-color:rgba(74,140,255,0.15); }
.node-type-utility .node-icon { background:rgba(34,211,238,0.15); color:var(--accent-cyan); }
.node-type-utility { border-color:rgba(34,211,238,0.12); }

/* === SVG EDGES === */
.edges-svg { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:1; }
.edge-path { fill:none; stroke-width:1.5; stroke:rgba(255,255,255,0.08); transition:stroke 0.3s, stroke-width 0.3s; }
.edge-path:hover { stroke:rgba(255,255,255,0.2); stroke-width:2; }
.edge-path.highlighted { stroke:var(--accent-blue); stroke-width:2; }
.edge-path.dimmed { stroke:rgba(255,255,255,0.02); }
.edge-label { font-size:9px; fill:var(--text-tertiary); font-family:var(--font); pointer-events:none; }

/* === SIDEBAR === */
.sidebar {
  position:fixed; top:56px; right:0; bottom:32px; width:400px; z-index:90;
  background:var(--bg-glass); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  border-left:1px solid var(--border); transform:translateX(100%); transition:transform 0.35s cubic-bezier(0.4,0,0.2,1);
  overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:16px;
}
.sidebar.open { transform:translateX(0); }
.sidebar-close {
  position:absolute; top:12px; right:12px; width:28px; height:28px; border-radius:6px;
  background:transparent; border:none; color:var(--text-tertiary); cursor:pointer;
  display:flex; align-items:center; justify-content:center; font-size:16px; transition:var(--transition);
}
.sidebar-close:hover { background:var(--bg-tertiary); color:var(--text-primary); }
.sidebar-header { padding-bottom:12px; border-bottom:1px solid var(--border); }
.sidebar-title { font-size:18px; font-weight:700; letter-spacing:-0.3px; }
.sidebar-subtitle { font-size:12px; color:var(--text-tertiary); margin-top:2px; }
.sidebar-section { }
.sidebar-section-title { font-size:10px; text-transform:uppercase; letter-spacing:0.8px; color:var(--text-tertiary); font-weight:600; margin-bottom:8px; }
.sidebar-tag {
  display:inline-flex; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:500;
  background:var(--bg-tertiary); color:var(--text-secondary); border:1px solid var(--border);
  margin:2px 4px 2px 0;
}
.sidebar-prop { display:flex; gap:8px; padding:6px 0; font-size:12px; }
.sidebar-prop-key { color:var(--text-tertiary); min-width:80px; flex-shrink:0; }
.sidebar-prop-val { color:var(--text-primary); font-family:'SF Mono','Fira Code',monospace; font-size:11px; word-break:break-all; }
.sidebar-body-text { font-size:13px; color:var(--text-secondary); line-height:1.7; }
.sidebar-monobox {
  background:var(--bg-secondary); border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:10px 12px; font-family:'SF Mono','Fira Code',monospace; font-size:11px;
  color:var(--text-secondary); line-height:1.5; white-space:pre-wrap;
}

/* === FILTER BAR === */
.filterbar {
  position:fixed; top:56px; left:0; right:0; height:0; z-index:80; overflow:hidden;
  background:var(--bg-glass); backdrop-filter:blur(20px); border-bottom:1px solid var(--border);
  transition:height 0.3s cubic-bezier(0.4,0,0.2,1);
}
.filterbar.open { height:44px; }
.filterbar-inner { display:flex; align-items:center; gap:8px; padding:6px 20px; overflow-x:auto; }
.filter-chip {
  padding:4px 12px; border-radius:20px; border:1px solid var(--border); background:transparent;
  color:var(--text-secondary); font-size:11px; font-family:var(--font); font-weight:500;
  cursor:pointer; transition:var(--transition); white-space:nowrap;
}
.filter-chip:hover { background:var(--bg-tertiary); color:var(--text-primary); }
.filter-chip.active { background:rgba(74,140,255,0.15); border-color:var(--accent-blue); color:var(--accent-blue); }

/* === PRESENTATION MODE === */
.presentation-overlay {
  position:fixed; inset:0; z-index:200; background:var(--bg-primary);
  display:none; flex-direction:column; align-items:center; justify-content:center;
}
.presentation-overlay.active { display:flex; }
.presentation-canvas {
  position:relative; width:90vw; height:80vh; overflow:hidden;
}
.presentation-step {
  font-size:14px; color:var(--text-tertiary); margin-top:16px;
}

/* === TOOLTIP === */
.tooltip {
  position:fixed; z-index:150; padding:8px 12px; border-radius:var(--radius-sm);
  background:var(--bg-card); border:1px solid var(--border); box-shadow:var(--shadow-lg);
  font-size:11px; color:var(--text-secondary); pointer-events:none; max-width:240px;
  display:none;
}

/* === ANIMATIONS === */
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
@keyframes slideIn { from{opacity:0;transform:translateX(20px)} to{opacity:1;transform:translateX(0)} }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
.fade-in { animation:fadeIn 0.4s ease-out; }
.slide-in { animation:slideIn 0.4s ease-out; }

/* === LOADING === */
.loading {
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  background:var(--bg-primary); z-index:999; flex-direction:column; gap:16px;
}
.loading-spinner { width:32px; height:32px; border:2px solid var(--border); border-top-color:var(--accent-blue); border-radius:50%; animation:spin 0.8s linear infinite; }
@keyframes spin { to{transform:rotate(360deg)} }
.loading-text { font-size:13px; color:var(--text-tertiary); }

/* === RESPONSIVE === */
@media (max-width:900px) {
  .sidebar { width:100%; }
  .topbar-logo span { display:none; }
  .topbar-btn span { display:none; }
  .search-container { max-width:none; }
}

/* Notification panel */
.notif { position:fixed; bottom:48px; right:20px; z-index:200; padding:10px 16px; border-radius:var(--radius-sm); background:var(--bg-card); border:1px solid var(--border); box-shadow:var(--shadow-lg); font-size:12px; color:var(--text-secondary); display:flex; align-items:center; gap:8px; animation:fadeIn 0.3s ease-out; }
.notif strong { color:var(--text-primary); }

/* Mini map */
.minimap {
  position:fixed; bottom:40px; right:16px; width:160px; height:100px; z-index:80;
  background:var(--bg-glass); backdrop-filter:blur(12px); border:1px solid var(--border);
  border-radius:var(--radius-sm); overflow:hidden; opacity:0.6; transition:var(--transition);
  pointer-events:none;
}
.minimap:hover { opacity:1; }
.minimap canvas { width:100%; height:100%; }
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="loading-spinner"></div>
  <div class="loading-text">Loading Architecture Explorer...</div>
</div>

<!-- Top Bar -->
<div class="topbar">
  <div class="topbar-logo">
    <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="2" width="20" height="20" rx="4" stroke="currentColor" stroke-width="1.5"/><path d="M7 7h10v10H7z" fill="currentColor" opacity="0.2"/><path d="M12 7v10M7 12h10" stroke="currentColor" stroke-width="1.5"/></svg>

<!-- Filter Bar -->
<div class="filterbar" id="filterbar">

</div>

<!-- Canvas -->
<div class="canvas-container" id="canvasContainer" oncontextmenu="return false">

    <svg class="edges-svg" id="edgesSvg"></svg>
    <div id="nodesContainer"></div>
  </div>
</div>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
  <button class="sidebar-close" onclick="closeSidebar()">✕</button>
  <div id="sidebarContent"></div>
</div>

<!-- Status Bar -->
<div class="statusbar">
  <div class="statusbar-item"><div class="statusbar-dot"></div>Connected</div>

    <div class="statusbar-item" id="statusZoom">100%</div>
    <div class="statusbar-item" id="statusPos">0, 0</div>
  </div>
</div>

<!-- Tooltip -->
<div class="tooltip" id="tooltip"></div>

// ============================================================
// CANVAS ENGINE
// ============================================================
const state = {
  pan: { x: 60, y: 20 },
  zoom: 0.85,
  selected: null,
  highlighted: new Set(),
  dimmed: false,
  searchQuery: '',
  activeFilters: new Set(),
  isGrabbing: false,
  dragStart: { x:0, y:0 },
  panStart: { x:0, y:0 },
  presentationStep: -1,
  presentationActive: false,
};

const canvas = document.getElementById('canvas');
const container = document.getElementById('canvasContainer');
const edgesSvg = document.getElementById('edgesSvg');
const nodesContainer = document.getElementById('nodesContainer');

function getNodePos(node) {
  return { x: node.x * state.zoom + state.pan.x, y: node.y * state.zoom + state.pan.y };
}

function transformPoint(px, py) {
  return { x: (px - state.pan.x) / state.zoom, y: (py - state.pan.y) / state.zoom };
}

// ============================================================
// RENDER ENGINE
// ============================================================
function render() {
  const scale = state.zoom;
  canvas.style.transform = `translate(${state.pan.x}px, ${state.pan.y}px) scale(${scale})`;

  // Render nodes
  nodesContainer.innerHTML = '';
  const nodeMap = {};
  MODEL.nodes.forEach(n => { nodeMap[n.id] = n; });

  const query = state.searchQuery.toLowerCase();
  const hasFilters = state.activeFilters.size > 0;
  const nodeEls = [];

  MODEL.nodes.forEach((node, idx) => {
    const el = document.createElement('div');
    el.className = `node node-type-${node.type}`;
    el.style.left = node.x + 'px';
    el.style.top = node.y + 'px';
    el.dataset.id = node.id;

    // Highlight / dim
    const matchesSearch = !query || node.name.toLowerCase().includes(query) || (node.file && node.file.toLowerCase().includes(query)) || (node.purpose && node.purpose.toLowerCase().includes(query)) || (node.functions && node.functions.some(f => f.toLowerCase().includes(query)));
    const matchesFilter = !hasFilters || state.activeFilters.has(node.type) || state.activeFilters.has(node.layer);
    const isSelected = state.selected === node.id;
    const isHighlighted = state.highlighted.has(node.id);

    if (query && !matchesSearch) el.classList.add('dimmed');
    else if (hasFilters && !matchesFilter) el.classList.add('dimmed');
    else if (state.dimmed && !isHighlighted && !isSelected) el.classList.add('dimmed');

    if (isSelected) el.classList.add('selected');
    if (isHighlighted) el.classList.add('highlighted');

    const typeLabel = node.type.charAt(0).toUpperCase() + node.type.slice(1);

    el.innerHTML = `
      <div class="node-header">
        <div class="node-icon">${node.name.charAt(0)}</div>
        <div>
          <div class="node-name">${node.name}</div>
          <div class="node-type">${typeLabel} · ${node.layer}</div>
        </div>
      </div>
      ${node.file && node.file !== '—' ? `<div class="node-file">${node.file}</div>` : ''}
    `;

    el.addEventListener('click', (e) => { e.stopPropagation(); selectNode(node.id); });
    el.addEventListener('mouseenter', () => { highlightConnections(node.id, true); });
    el.addEventListener('mouseleave', () => { highlightConnections(node.id, false); });
    el.style.zIndex = isSelected ? 20 : 10;

    nodesContainer.appendChild(el);
    nodeEls.push(el);
  });
  renderEdges(nodeMap);
  updateStatus();
}

function renderEdges(nodeMap) {
  edgesSvg.innerHTML = '';
  const hasFilters = state.activeFilters.size > 0;
  const query = state.searchQuery.toLowerCase();

  MODEL.edges.forEach(edge => {
    const src = nodeMap[edge.source];
    const dst = nodeMap[edge.target];
    if (!src || !dst) return;

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    const sx = src.x + 110, sy = src.y + 30;
    const dx = dst.x + 110, dy = dst.y;
    const mid = (sy + dy) / 2;
    const d = `M ${sx} ${sy} C ${sx} ${mid}, ${dx} ${mid}, ${dx} ${dy}`;
    path.setAttribute('d', d);
    path.classList.add('edge-path');

    // Dim logic
    const matchesQuery = !query || edge.label.toLowerCase().includes(query) || (edge.desc && edge.desc.toLowerCase().includes(query));
    if (query && !matchesQuery) path.classList.add('dimmed');
    if (state.highlighted.size > 0) {
      if (!state.highlighted.has(edge.source) && !state.highlighted.has(edge.target)) {
        path.classList.add('dimmed');
      } else {
        path.classList.add('highlighted');
      }
    }
    edgesSvg.appendChild(path);

    // Edge label
    if (edge.label) {
      const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      label.textContent = edge.label;
      label.setAttribute('x', (sx + dx) / 2);
      label.setAttribute('y', mid - 4);
      label.classList.add('edge-label');
      if (state.highlighted.size > 0 && !state.highlighted.has(edge.source) && !state.highlighted.has(edge.target)) {
        label.setAttribute('opacity', '0.05');
      }
      edgesSvg.appendChild(label);
    }
  });
}

function updateStatus() {
  document.getElementById('statusNodes').textContent = `${MODEL.nodes.length} nodes`;
  document.getElementById('statusEdges').textContent = `${MODEL.edges.length} connections`;
  document.getElementById('statusZoom').textContent = `${Math.round(state.zoom * 100)}%`;
  document.getElementById('statusPos').textContent = `${Math.round(state.pan.x)}, ${Math.round(state.pan.y)}`;
}

  const sb = document.getElementById('sidebarContent');
  const isSelected = state.selected === node.id;
  const typeLabel = node.type.charAt(0).toUpperCase() + node.type.slice(1);
  const allDeps = node.deps.map(d => MODEL.nodes.find(n => n.id === d)).filter(Boolean);
  const allConsumers = node.consumers.map(c => MODEL.nodes.find(n => n.id === c)).filter(Boolean);
  const nodeApis = MODEL.edges.filter(e => (e.source === node.id || e.target === node.id) && e.type === 'request');
  const nodeCalls = MODEL.edges.filter(e => (e.source === node.id || e.target === node.id) && e.type === 'call');

function closeSidebar() {

  document.getElementById('sidebar').classList.remove('open');
  render();

// HIGHLIGHT CONNECTIONS
// ============================================================
function highlightConnections(nodeId, active) {
  state.highlighted.clear();
  state.dimmed = active;
  if (active) {
    state.highlighted.add(nodeId);
    MODEL.edges.forEach(e => {
      if (e.source === nodeId) state.highlighted.add(e.target);
      if (e.target === nodeId) state.highlighted.add(e.source);
    });
  }
  render();
}

// ============================================================
// CANVAS CONTROLS
// ============================================================
let isPanning = false, startX, startY, startPanX, startPanY;

container.addEventListener('mousedown', (e) => {
  if (e.target === container || e.target === nodesContainer || e.target.tagName === 'svg') {
    isPanning = true;
    startX = e.clientX;
    startY = e.clientY;
    startPanX = state.pan.x;
    startPanY = state.pan.y;
    container.classList.add('grabbing');
    closeSidebar();
  }
});

document.addEventListener('mousemove', (e) => {
  if (isPanning) {
    state.pan.x = startPanX + (e.clientX - startX);
    state.pan.y = startPanY + (e.clientY - startY);
    render();
  }
});

document.addEventListener('mouseup', () => {
  isPanning = false;
  container.classList.remove('grabbing');
});

container.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = container.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const factor = e.deltaY > 0 ? 0.92 : 1.08;
  const newZoom = Math.max(0.2, Math.min(3, state.zoom * factor));
  state.pan.x = mx - (mx - state.pan.x) * (newZoom / state.zoom);
  state.pan.y = my - (my - state.pan.y) * (newZoom / state.zoom);
  state.zoom = newZoom;
  render();
});

function fitView() {
  const minX = Math.min(...MODEL.nodes.map(n => n.x)) - 40;
  const minY = Math.min(...MODEL.nodes.map(n => n.y)) - 40;
  const maxX = Math.max(...MODEL.nodes.map(n => n.x + 220)) + 40;
  const maxY = Math.max(...MODEL.nodes.map(n => n.y + 60)) + 40;
  const w = container.clientWidth, h = container.clientHeight;
  const scale = Math.min(w / (maxX - minX), h / (maxY - minY), 1);
  state.zoom = scale;
  state.pan.x = (w - (maxX + minX) * scale) / 2;
  state.pan.y = 20;
  render();
}

function resetView() {
  state.zoom = 0.85;
  state.pan.x = 60;
  state.pan.y = 20;
  state.selected = null;
  state.highlighted.clear();
  state.dimmed = false;
  closeSidebar();
  render();
}

// ============================================================
// SEARCH
// ============================================================
const searchInput = document.getElementById('searchInput');
let searchTimeout;

searchInput.addEventListener('input', () => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    state.searchQuery = searchInput.value;
    state.highlighted.clear();
    state.dimmed = false;
    if (state.searchQuery) {
      const q = state.searchQuery.toLowerCase();
      MODEL.nodes.forEach(n => {
        if (n.name.toLowerCase().includes(q) || (n.file && n.file.toLowerCase().includes(q)) || (n.purpose && n.purpose.toLowerCase().includes(q))) {
          state.highlighted.add(n.id);
        }
      });
      if (state.highlighted.size > 0) {
        state.dimmed = true;
        // Find first highlighted node and center on it
        const first = MODEL.nodes.find(n => state.highlighted.has(n.id));
        if (first) {
          const cx = container.clientWidth / 2;
          const cy = container.clientHeight / 2;
          state.pan.x = cx - first.x * state.zoom;
          state.pan.y = cy - first.y * state.zoom;
        }
      }
    }
    render();
  }, 200);
});

searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    searchInput.value = '';
    state.searchQuery = '';
    state.highlighted.clear();
    state.dimmed = false;
    render();
  }
});

// ============================================================
// FILTERS
// ============================================================
function toggleFilters() {
  const fb = document.getElementById('filterbar');
  fb.classList.toggle('open');
}

function initFilters() {
  const list = document.getElementById('filterList');
  MODEL.filters.forEach(f => {
    const chip = document.createElement('button');
    chip.className = 'filter-chip';
    chip.textContent = f;
    chip.onclick = () => {
      chip.classList.toggle('active');
      if (chip.classList.contains('active')) state.activeFilters.add(f.toLowerCase());
      else state.activeFilters.delete(f.toLowerCase());
      render();
    };
    list.appendChild(chip);
  });
}

// ============================================================
// FLOW VIEWER
// ============================================================
function showFlow(flowId) {
  const flow = MODEL.flows.find(f => f.id === flowId);
  if (!flow) return;

  const sb = document.getElementById('sidebarContent');
  sb.innerHTML = `
    <div class="sidebar-header fade-in">
      <div class="sidebar-title">${flow.name}</div>
      <div class="sidebar-subtitle">${flow.description}</div>
      <button class="topbar-btn" style="margin-top:8px" onclick="animateFlow('${flowId}')">▶ Animate Flow</button>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-section-title">Execution Steps</div>
      ${flow.steps.map((s, i) => `
        <div class="sidebar-prop fade-in" style="padding:8px 0;border-bottom:1px solid var(--border);animation-delay:${i*0.03}s">
          <div style="display:flex;gap:10px;align-items:flex-start">
            <div style="width:20px;height:20px;border-radius:10px;background:var(--accent-blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;margin-top:1px">${i+1}</div>
            <div>
              <div style="font-size:13px;font-weight:600;color:var(--text-primary)">${s.action}</div>
              <div style="font-size:11px;color:var(--text-tertiary);margin-top:2px">${s.detail}</div>
              <div style="font-size:10px;color:var(--accent-blue);margin-top:2px">${s.nodeId}</div>
            </div>
          </div>
        </div>
      `).join('')}
    </div>
  `;
  document.getElementById('sidebar').classList.add('open');
}

function animateFlow(flowId) {
  const flow = MODEL.flows.find(f => f.id === flowId);
  if (!flow) return;

  // Close sidebar, clear canvas, highlight steps one by one
  closeSidebar();
  state.highlighted.clear();
  state.dimmed = true;

  let stepIdx = 0;
  const interval = setInterval(() => {
    if (stepIdx >= flow.steps.length) {
      clearInterval(interval);
      // Show summary
      showNotif('Flow complete: ' + flow.steps.length + ' steps');
      return;
    }
    const step = flow.steps[stepIdx];
    const node = MODEL.nodes.find(n => n.id === step.nodeId);
    if (node) {
      state.highlighted.add(node.id);
      // Also highlight edge leading to this step
      if (stepIdx > 0) {
        const prevStep = flow.steps[stepIdx - 1];
        MODEL.edges.forEach(e => {
          if (e.source === prevStep.nodeId && e.target === step.nodeId) {
            state.highlighted.add(e.source);
          }
        });
      }
      // Center on node
      const cx = container.clientWidth / 2;
      const cy = container.clientHeight / 2;
      state.pan.x = cx - node.x * state.zoom;
      state.pan.y = cy - node.y * state.zoom;
    }
    render();
    stepIdx++;
  }, 800);
}

function showNotif(msg) {
  const n = document.createElement('div');
  n.className = 'notif';
  n.innerHTML = msg;
  document.body.appendChild(n);
  setTimeout(() => n.remove(), 3000);
}

// ============================================================
// PRESENTATION MODE
// ============================================================
function togglePresentation() {
  state.presentationActive = !state.presentationActive;
  // Simple implementation: highlight layers step by step
  if (state.presentationActive) {
    closeSidebar();
    state.highlighted.clear();
    state.dimmed = true;
    state.presentationStep = 0;
    const layers = ['user', 'web', 'app', 'api', 'service', 'utility', 'uac', 'external', 'frontend', 'infra'];
    const interval = setInterval(() => {
      if (state.presentationStep >= layers.length) {
        clearInterval(interval);
        state.dimmed = false;
        render();
        showNotif('Presentation complete');
        return;
      }
      const layer = layers[state.presentationStep];
      MODEL.nodes.forEach(n => {
        if (n.layer === layer) state.highlighted.add(n.id);
      });
      render();
      state.presentationStep++;
    }, 1200);
  } else {
    state.highlighted.clear();
    state.dimmed = false;
    render();
  }
}

// ============================================================
// KEYBOARD SHORTCUTS
// ============================================================
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeSidebar(); searchInput.blur(); }
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); searchInput.focus(); }
  if (e.key === 'f' && !e.ctrlKey && !e.metaKey && !searchInput.matches(':focus')) {
    toggleFilters();
  }
});

// ============================================================
// INIT
// ============================================================
function init() {
  initFilters();
  render();
  document.getElementById('loading').style.display = 'none';
  setTimeout(fitView, 100);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
