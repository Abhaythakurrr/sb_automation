# Nginx config for Stonebranch Automation Platform
# Place this file at: /etc/nginx/conf.d/sb-automation.conf
#
# Handles:
#   - HTTPS termination with internal SSL cert
#   - Frontend (Next.js) on port 3000
#   - Backend API on port 3001
#   - Private DNS — only reachable from internal network
#   - No public internet exposure

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name sb-automation.adient.internal;
    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    server_name sb-automation.adient.internal;

    # SSL — internal certificate from org PKI
    ssl_certificate     /etc/ssl/certs/sb-automation.adient.internal.crt;
    ssl_certificate_key /etc/ssl/private/sb-automation.adient.internal.key;

    # Modern TLS only
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/sb-automation-access.log;
    error_log  /var/log/nginx/sb-automation-error.log;

    # File upload size limit (matches backend MAX_FILE_SIZE)
    client_max_body_size 11M;

    # ── Backend API (/api/*) → port 3001 ─────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;   # allow time for long UAC API calls
        proxy_connect_timeout 10s;
    }

    # ── Frontend (Next.js) → port 3000 ───────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # ── Health check (no auth required) ──────────────────────────────────────
    location /health {
        proxy_pass http://127.0.0.1:3001/health;
        access_log off;
    }
}
